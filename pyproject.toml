[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "knowflow-agent-platform"
version = "0.1.0"
description = "Reliable, auditable enterprise knowledge-workflow agent MVP"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "KnowFlow maintainers" }]
dependencies = [
  "alembic>=1.16,<2",
  "asyncmy>=0.2.10,<1",
  "fastapi[standard]>=0.139,<0.140",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "langfuse>=4,<5",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-redis>=0.5,<0.6",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.36,<2",
  "opentelemetry-instrumentation-fastapi>=0.57b0,<1",
  "opentelemetry-sdk>=1.36,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pymilvus>=2.5,<3",
  "pypdf>=6,<7",
  "pyjwt>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "redis>=6,<8",
  "rocketmq-python-client==5.1.1",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "structlog>=25,<26",
  "tenacity>=9,<10",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
knowflow = "knowflow.cli:app"

[dependency-groups]
dev = [
  "freezegun>=1.5,<2",
  "hypothesis>=6.130,<7",
  "locust>=2.37,<3",
  "mypy>=1.16,<2",
  "pre-commit>=4.2,<5",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6.2,<8",
  "pyyaml>=6.0.2,<7",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
  "testcontainers[mysql,redis]>=4.10,<5",
  "types-pyyaml>=6.0.12,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/knowflow"]

[tool.pytest.ini_options]
minversion = "8.4"
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: requires local dependency containers",
  "real_model: calls a configured external model provider",
  "fault: deterministic failure-injection scenario",
]

[tool.coverage.run]
branch = true
source = ["knowflow"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["knowflow"]
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pymilvus.*", "rocketmq.*", "langgraph_checkpoint_redis.*"]
ignore_missing_imports = true
